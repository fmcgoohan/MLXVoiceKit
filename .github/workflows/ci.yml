name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: xcode-27  # GitHub Xcode 27 image (macOS 27, arm64); labels are per Xcode major
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - run: swift --version
      # Build + test only. Native MLX generation is not exercised in CI: hosted
      # runners are below the 16 GB unified-memory floor and lack the Metal
      # toolchain download. See README.
      - run: swift build
      - run: swift test
